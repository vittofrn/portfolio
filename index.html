<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vittoria Fornari · graphic &amp; visual designer</title>
<meta name="description" content="Portfolio of Vittoria Fornari, graphic and visual designer working between Rome and Barcelona. Brand identity, editorial design, UI and illustration.">
<meta name="theme-color" content="#FFFFFF">

<meta property="og:type" content="website">
<meta property="og:title" content="Vittoria Fornari · graphic &amp; visual designer">
<meta property="og:description" content="A sketchbook of work and memories. Brand identity, editorial design, UI and illustration.">
<meta property="og:image" content="assets/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body id="top">

<header class="masthead">
  <a class="wordmark" href="#top">Vittoria Fornari</a>

  <nav class="masthead__nav" aria-label="Sections">
    <a href="#works">works<b class="count"></b></a>
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </nav>

  <div class="place">
    <span class="clock"></span>
    <span>Barcelona, Spain</span>
  </div>

  <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="masthead__nav">
    <svg class="burger__svg" viewBox="0 0 32 22" aria-hidden="true">
      <path class="burger__bar burger__bar--a" d="M1,2 C7,4 14,0 20,2.4 C24,4 28,1.4 31,2.6"/>
      <path class="burger__bar burger__bar--b" d="M1,19 C7,21 14,17 20,19.4 C24,21 28,18.4 31,19.6"/>
    </svg>
  </button>
</header>

<main>

  <!-- ============================================ the map of the work -->
  <section class="map" id="work" aria-label="Selected work">
    <div class="map__spray" aria-hidden="true">
      <img class="map__spray__blob" style="left:-52.82px; top:225.79px;width:520.488px;height:638.536px;--d:0s"   src="assets/images/bg/spray-7.svg" alt="">
      <img class="map__spray__blob" style="left:360.81px; top:303.32px;width:353.589px;height:471.636px;--d:.09s" src="assets/images/bg/spray-6.svg" alt="">
      <img class="map__spray__blob" style="left:calc(40% + 26.47px); top:293.1px; width:408.647px;height:434.28px;--d:.18s" src="assets/images/bg/spray-4.svg" alt="">
      <img class="map__spray__blob" style="left:calc(20% + 255.27px);top:333.3px; width:256.898px;height:417.443px;--d:.27s" src="assets/images/bg/spray-5.svg" alt="">
      <img class="map__spray__blob" style="left:calc(40% + 354.33px);top:244.07px;width:346.34px; height:460.34px;--d:.36s" src="assets/images/bg/spray-3.svg" alt="">
      <img class="map__spray__blob" style="left:calc(60% + 223px);  top:77px;    width:372.699px;height:643.87px; --d:.45s" src="assets/images/bg/spray-2.svg" alt="">
      <img class="map__spray__blob" style="left:calc(80% + 91.99px);top:162.72px;width:353.589px;height:471.636px;--d:.54s" src="assets/images/bg/spray-1.svg" alt="">
    </div>
    <p class="edge edge--left"></p>
    <p class="edge edge--right"></p>

    <div class="filter" role="group" aria-label="Filter by discipline"></div>

    <div class="map__field">
      <svg class="map__links" aria-hidden="true"></svg>
      <div class="map__nodes"></div>
    </div>

    <a class="cue" href="#works">[ scroll down ]</a>
  </section>

  <!-- ================================================== the works, listed -->
  <section class="works" id="works" aria-labelledby="works-h">
    <div class="lede">
      <h2 id="works-h"><img class="lede__art" src="assets/images/title-works.png" alt="Works"></h2>
      <p></p>
    </div>
    <ol class="works__grid"></ol>
  </section>

  <!-- ============================================================ about -->
  <section class="section about" id="about" aria-labelledby="about-h">
    <div class="lede">
      <h2 id="about-h"><img class="lede__art" src="assets/images/title-about.png" alt="About"></h2>
    </div>
    <p class="about__headline"></p>
    <div class="about__grid">
      <figure class="portrait"></figure>
      <div class="about__body"></div>
    </div>
    <div class="disciplines"></div>
  </section>

</main>

<footer class="colophon" id="contact">
  <h2></h2>
  <p class="colophon__sub"></p>
  <a class="colophon__email" href="#"></a>
  <div class="colophon__links"></div>
  <div class="colophon__foot"></div>
</footer>



<!-- case study page -->
<article class="study" tabindex="-1" hidden></article>

<!-- archive: a lightweight overlay on the landing, not a page of its own -->
<div class="lightbox" tabindex="-1" hidden>
  <div class="lightbox__backdrop" data-close></div>
  <div class="lightbox__panel">
    <button class="lightbox__close" type="button" aria-label="Close" data-close>&times;</button>
    <h2 class="lightbox__title"></h2>
    <div class="lightbox__strip"></div>
  </div>
</div>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
