<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vittoria Fornari — graphic &amp; visual designer</title>
<meta name="description" content="Portfolio of Vittoria Fornari, graphic and visual designer working between Rome and Barcelona. Brand identity, editorial design, UI and illustration.">
<meta name="theme-color" content="#FFFFFF">

<meta property="og:type" content="website">
<meta property="og:title" content="Vittoria Fornari — graphic &amp; visual designer">
<meta property="og:description" content="A sketchbook of work and memories. Brand identity, editorial design, UI and illustration.">
<meta property="og:image" content="assets/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body id="top">

<header class="masthead">
  <a class="wordmark" href="#top">Vittoria Fornari</a>

  <nav class="masthead__nav" aria-label="Sections">
    <a href="#works">works<b class="count"></b></a>
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </nav>

  <div class="place">
    <span class="clock"></span>
    <span>Barcelona, Spain</span>
  </div>

  <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="masthead__nav">
    <svg class="burger__svg" viewBox="0 0 32 22" aria-hidden="true">
      <path class="burger__bar burger__bar--a" d="M1,2 C7,4 14,0 20,2.4 C24,4 28,1.4 31,2.6"/>
      <path class="burger__bar burger__bar--b" d="M1,19 C7,21 14,17 20,19.4 C24,21 28,18.4 31,19.6"/>
    </svg>
  </button>
</header>

<main>

  <!-- ============================================ the map of the work -->
  <section class="map" id="work" aria-label="Selected work">
    <p class="edge edge--left"></p>
    <p class="edge edge--right"></p>

    <div class="filter" role="group" aria-label="Filter by discipline"></div>

    <div class="map__field">
      <svg class="map__links" aria-hidden="true"></svg>
      <div class="map__nodes"></div>
    </div>

    <a class="cue" href="#works">[ scroll down ]</a>
  </section>

  <!-- ================================================== the works, listed -->
  <section class="works" id="works" aria-labelledby="works-h">
    <div class="lede">
      <h2 id="works-h"><img class="lede__art" src="assets/images/title-works.png" alt="Works"></h2>
      <p></p>
    </div>
    <ol class="works__grid"></ol>
  </section>

  <!-- ============================================================ about -->
  <section class="section about" id="about" aria-labelledby="about-h">
    <div class="lede">
      <span class="mark">[ about ]</span>
      <h2 id="about-h"><img class="lede__art" src="assets/images/title-about.png" alt="About"></h2>
    </div>
    <p class="about__headline"></p>
    <div class="about__grid">
      <figure class="portrait"></figure>
      <div class="about__body"></div>
    </div>
    <div class="disciplines"></div>
  </section>

</main>

<footer class="colophon" id="contact">
  <h2></h2>
  <p class="colophon__sub"></p>
  <a class="colophon__email" href="#"></a>
  <div class="colophon__links"></div>
  <div class="colophon__foot"></div>
</footer>



<!-- case study page -->
<article class="study" tabindex="-1" hidden></article>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
